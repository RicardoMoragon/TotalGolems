// The build of one Minecraft version: Stonecutter runs this script once per version listed in settings.gradle, with the
// sources (src/, shared by all) switched to that version. Its own dependency versions are in
// versions/<version>/gradle.properties.

def versionProperties = new Properties()
rootProject.file("versions/${stonecutter.current.project}/gradle.properties").withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> project.ext.set(key, value) }

// Minecraft is obfuscated up to 1.21.11 and unobfuscated from 26.1 on. Obfuscated versions need the remapping Loom,
// Mojang's mappings and a remapped jar; unobfuscated ones need none of that.
def unobfuscated = stonecutter.eval(stonecutter.current.version, '>=26.1')
def javaVersion = (project.java_version as String).toInteger()

apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'maven-publish'

version = "${rootProject.mod_version}+${project.minecraft_version}"
group = rootProject.maven_group

base {
	archivesName = rootProject.name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"totalgolems" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Every version runs in its own folder of the root project's run/, so their worlds and options stay apart.
	runConfigs.configureEach {
		runDir = "../../run/${stonecutter.current.project}"
	}
}

// Game tests live in src/gametest: `gradlew runGameTest` (server logic) and `gradlew runClientGameTest` (screenshots).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "totalgolems-test"
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (unobfuscated) {
		implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	} else {
		// Mojang's names at development time, the same as the unobfuscated versions use; Loom remaps the jar.
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

processResources {
	def properties = [
		version          : project.version,
		minecraft_range  : project.minecraft_range,
		java_version     : javaVersion,
	]
	inputs.properties properties

	filesMatching(["fabric.mod.json", "*.mixins.json"]) {
		expand properties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = javaVersion
	it.options.compilerArgs += ['-Xmaxerrs', '2000']
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	def projectName = rootProject.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}

// The jar players install: the remapped jar on obfuscated versions, the plain jar on unobfuscated ones.
if (!unobfuscated) {
	tasks.named('jar') { archiveClassifier = 'dev' }
	tasks.named('remapJar') { archiveClassifier = '' }
}
tasks.register('releaseJar') {
	group = 'build'
	description = 'Builds the jar to install for this Minecraft version.'
	dependsOn unobfuscated ? 'jar' : 'remapJar'
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// `gradlew runGameTest -PtestFilter=<selector>` runs only the tests that match, as /test run does.
if (project.hasProperty('testFilter')) {
	tasks.matching { it.name == 'runGameTest' }.configureEach {
		jvmArgs "-Dfabric-api.gametest.filter=${project.testFilter}"
	}
}
